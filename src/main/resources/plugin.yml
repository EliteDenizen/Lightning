name: Lightning
version: ${project.version}
main: dev.elitedenizen.lightning.Lightning
api-version: "1.21"
paper-plugin-loader: dev.elitedenizen.lightning.LightningPluginLoader
description: Custom commands, plugin hooks, and MiniMessage formatting for any plugin's messages.
authors:
  - EliteDenizen
softdepend:
  - PlaceholderAPI
  - MiniPlaceholders

commands:
  lightning:
    description: Lightning admin command.
    usage: /lightning <reload|reset|debug>
    permission: lightning.admin
    aliases:
      - lt
      - ltn

permissions:
  lightning.admin:
    description: Access to all Lightning admin commands.
    default: op
  lightning.bypass:
    description: Bypass cooldowns and usage limits.
    default: false
