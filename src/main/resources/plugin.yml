name: Lightning
version: '${version}'
main: com.denizenmc.lightning.Lightning
paper-plugin-loader: com.denizenmc.lightning.LightningLoader
api-version: '1.21'
folia-supported: true
author: EliteDenizen
website: https://denizenmc.com
description: Go beyond simple formatting with universal message customization, reusable components, and fully configurable commands.
softdepend:
  - PlaceholderAPI
  - packetevents

permissions:
  lightning.admin:
    description: Grants access to all Lightning administrative commands.
    default: op
  lightning.bypass:
    description: Bypasses cooldowns and execution limits for custom commands.
    default: false
  lightning.trusted:
    description: Exempts the player from Guard tag restrictions.
    default: op