# Example template file.

teleport-fx:
  actions:
    - sound: ENTITY_ENDERMAN_TELEPORT
    - particle:
        type: PORTAL
        count: 30
        offset: [0.4, 0.8, 0.4]
        speed: 0.1

teleport-title:
  actions:
    - title:
        title: "&5&lTELEPORTING"
        subtitle: "&dHang tight..."
        fadeIn: 5
        stay: 30
        fadeOut: 10

# templates can reference each other, expanded in order
warp:
  actions:
    - template: teleport-fx
    - template: teleport-title
