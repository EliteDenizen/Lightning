# Add actions to commands from other plugins.

# Plugin names are case-sensitive, so make sure they match exactly.
Essentials:

  spawn:
    actions:
      - message:
          - "&6Welcome back, &e{player}&6."
          - "&7Teleported to spawn."
      - sound: ENTITY_PLAYER_LEVELUP
      - title:
          title: "&6Welcome Back"
          subtitle: "&7Good to see you"
          fadeIn: 10
          stay: 60
          fadeOut: 10

  fly:
    # Conditions work exactly the same as they do for custom commands.
    conditions:
      permission: "essentials.fly"
    actions:
      - actionbar: "&7Flight toggled"
      - sound:
          name: ENTITY_ENDERMAN_TELEPORT
          pitch: 1.5

  home|homes: # Match multiple commands by separating their names with |.
    actions:
      - sound: ENTITY_ENDERMAN_TELEPORT
      - particle:
          type: PORTAL
          count: 20
          speed: 0.05

  # /heal is used here as an example.
  # If Lightning can't hook into it, check /lt debug to see which plugin has
  # registered the command.
  heal:
    actions:
      - potion: REGENERATION:5:1
      - xp:
          amount: 10
          mode: POINTS
      - randomMessage:
          - "&aFeeling better already."
          - "&aAll patched up."
          - "&aGood as new."

  warp:
    conditions:
      worlds:
        - world
        - world_nether
      worldsNegate: false # Set to true to match every world except these above.
    actions:
      - bossbar:
          title: "&5Warping..."
          color: PURPLE
          duration: 3s
      - delay: 1s
      - template: teleport-fx

  # Requires PlaceholderAPI.
  # Checks whether a placeholder matches the value you expect. This one
  # gates the pay command by rank, but placeholder can gate any command.
  pay:
    conditions:
      arguments: ">=2"
      placeholder:
        "%vault_rank%":
          equals: "VIP"
          ignoreCase: true
      message: "&cOnly VIP members can send payments through this server."
    actions:
      - broadcast:
          text: "&e{player} &7sent a payment."
          permission: "lightning.admin"
      - command:
          console:
            - "eco give {player} 10"
          player:
            - "say Thanks for the payment!"

  # Applies to every Essentials command that doesn't have its own rule.
  default:
    actions:
      - sound: BLOCK_NOTE_BLOCK_PLING
    blacklist: # Commands to ignore.
      - spawn
      - heal

# Vanilla commands aren't owned by plugins.
# Use the reserved "Minecraft" key to hook into commands like /gamemode or /kill.
Minecraft:

  gamemode:
    conditions:
      permission: "minecraft.command.gamemode"
    actions:
      - actionbar: "&7Gamemode changed"

  kill:
    conditions:
      health:
        min: 20
    actions:
      - message: "&cThat would've been a waste, you're at full health."


# Another example with multiple commands and arguments.
EcoItems:

  ecoitems give:
    conditions:
      arguments: ">=2"
    actions:
      - broadcast: "&e{player} &7gave &f{arg2} &7a &e{arg3}&7."
      - sound: ENTITY_PLAYER_LEVELUP
